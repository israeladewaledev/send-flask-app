<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Nile University Admin Portal</title>
  <!-- Poppins Font as per the guide -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --nile-blue: #0606ba;
      --nile-red: #ff0000;
      --bg-light: #f5f5f5;
      --white: #ffffff;
      --border-color: #d5d5d5;
    }

    body {
      margin: 0;
      padding: 40px;
      font-family: "Poppins", sans-serif;
      background-color: #f5f5f5;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    img {
      height: 80px;
      margin-bottom: 20px;
    }

    .auth-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .auth-card {
      background: #fff;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 420px;
      text-align: center;
      border: 1px solid #eee;
    }

    .auth-card h1 {
      color: #000000;
      margin-bottom: 10px;
      font-weight: 800;
      font-size: 2rem;
    }

    .auth-card p {
      color: #666;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .input-group {
      text-align: left;
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--nile-blue);
      font-size: 14px;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
      font-size: 1rem;
    }

    .btn-submit {
      background: #0606ba;
      color: white;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s, opacity 0.3s;
      margin-top: 10px;
    }

    .btn-submit:hover {
      opacity: 0.9;
      background-color: #002244;
    }

    .btn-submit:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .login-footer {
      margin-top: 25px;
    }

    .forgot-link {
      color: var(--nile-blue);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.9rem;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 3px solid rgba(255, 255, 255, .3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s ease-in-out infinite;
      margin-right: 10px;
      vertical-align: middle;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body class="auth-page">

  <div class="auth-container">
    <div class="auth-card">
      <img src="{{ url_for('static', filename='assets/images/logo.png') }}" alt="Nile University Logo">
      <h1>Welcome Back</h1>
      <p>Login to Nile University Administrative Automation System</p>

      <form id="loginForm" method="GET">
        <div class="input-group">
          <label>User Role</label>
          <select id="role" name="role" required>
            <option value="" disabled selected>Select your role</option>
            <option value="student">Student</option>
            <optgroup label="Staff (Clearance Units)">
              <option value="staff_library">Library Services</option>
              <option value="staff_accounts">Account Unit</option>
              <option value="staff_hostel">Hostel Unit</option>
              <option value="staff_services">Student Services</option>
              <option value="staff_division">Academic Division</option>
              <option value="staff_store">Central Store</option>
              <option value="staff_department">Academic Department</option>
              <option value="staff_honoris">Honoris 21C Skills</option>
            </optgroup>
            <option value="admin">Administrator</option>
          </select>
        </div>
        <div class="input-group">
          <label id="label-id">ID Number</label>
          <input type="text" id="idNumber" placeholder="Enter Matric or Staff ID" required>
        </div>
        <div class="input-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-submit" id="submitBtn">Sign In</button>
      </form>
      <div class="login-footer">
        <a href="#" class="forgot-link">Forgot Password?</a>
      </div>
    </div>
  </div>

  <script>
    const roleSelect = document.getElementById('role');
    const labelId = document.getElementById('label-id');
    const inputId = document.getElementById('idNumber');
    const loginForm = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');

    roleSelect.addEventListener('change', () => {
      const role = roleSelect.value;
      if (role === 'student') {
        labelId.innerText = 'Matriculation Number';
        inputId.placeholder = 'e.g. 21/123456';
      } else if (role.startsWith('staff_')) {
        const unitName = roleSelect.options[roleSelect.selectedIndex].text;
        labelId.innerText = `${unitName} ID`;
        inputId.placeholder = 'e.g. S-9921';
      } else {
        labelId.innerText = 'Admin ID';
        inputId.placeholder = 'e.g. A-1001';
      }
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const role = roleSelect.value;
      const id_number = inputId.value;
      const password = document.getElementById('password').value;
      
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> Signing in...';

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ role, id_number, password })
        });

        const result = await response.json();

        if (result.success) {
          if (result.role === 'student') {
            window.location.href = "{{ url_for('student_home') }}";
          } else if (result.role === 'staff') {
            window.location.href = `{{ url_for('staff_home') }}?unit=${result.unit}`;
          } else {
            window.location.href = "{{ url_for('admin_home') }}";
          }
        } else {
          // Show alert using the global modal system (it's in base.html usually, but login.html doesn't extend it)
          // For now, use simple alert if modal is not available on login page
          alert(result.message || 'Login failed.');
          submitBtn.disabled = false;
          submitBtn.innerHTML = 'Sign In';
        }
      } catch (error) {
        console.error('Login error:', error);
        alert('An error occurred during login. Please ensure your backend is running.');
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Sign In';
      }
    });
  </script>
</body>

</html>
